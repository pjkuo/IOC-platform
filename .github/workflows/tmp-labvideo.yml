name: tmp-labvideo
on:
  push:
    branches: [main]
    paths: ['_patch/**']
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: copy assets + patch + gate
        run: |
          set -e
          mkdir -p assets/video
          curl -sSfL https://raw.githubusercontent.com/pjkuo/cc-platform/main/assets/video/unplugged-packet-120s.mp4 -o assets/video/unplugged-packet-120s.mp4
          curl -sSfL https://raw.githubusercontent.com/pjkuo/cc-platform/main/assets/video/unplugged-packet-120s.jpg -o assets/video/unplugged-packet-120s.jpg
          ls -la assets/video
          test "$(md5sum assets/video/unplugged-packet-120s.mp4 | cut -d' ' -f1)" = "af55e17e54d0ddeeb2d84cb8ffebae33"
          test "$(md5sum assets/video/unplugged-packet-120s.jpg | cut -d' ' -f1)" = "da7782207fd24e435ed19f9e6b7bd552"
          test "$(md5sum _patch/lab-video.html | cut -d' ' -f1)" = "7077db1df5cbcea1e836360fa5eaee1d"
          test "$(md5sum student.html | cut -d' ' -f1)" = "5575fbec3dc5abd889721cb28feee736"
          test "$(md5sum teacher.html | cut -d' ' -f1)" = "e37fd8c74f220c02121265dffc99f97d"
          python3 - <<'PY'
          b=open('_patch/lab-video.html','rb').read()
          for f in ('student.html','teacher.html'):
              s=open(f,'rb').read()
              assert b'cc-labvid-script' not in s
              i=s.rfind(b'</body>'); assert i>0
              open(f,'wb').write(s[:i]+b+s[i:])
          PY
          test "$(md5sum student.html | cut -d' ' -f1)" = "618f2a4df83245b8ae7f0e1a647db951"
          test "$(md5sum teacher.html | cut -d' ' -f1)" = "4be014a5376c29495bb8735f9ccdbe24"
          git rm -rq _patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/video student.html teacher.html
          git commit -m "不插電五站實習：student/teacher 嵌入 120 秒演練影片（YouTube T2teUYwV54g＋站內低解析小檔，與 cc-platform 同步） [skip ci]"
          git push origin HEAD:main
