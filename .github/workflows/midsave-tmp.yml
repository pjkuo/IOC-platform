name: midsave-tmp
on:
  push:
    paths: ['.github/workflows/midsave-tmp.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply with md5 gates
        run: |
          python3 - <<'PY'
          import base64,hashlib,sys
          RULES=[
           ('async function cloudAttemptCount(id){', "function tsMs(v){ const n=Number(v); if(String(v).trim()!=='' && isFinite(n)) return n; const t=new Date(v).getTime(); return isNaN(t)? String(v) : t; } /* 後端回傳的 ts 可能是毫秒數字：一律換算後再比對 */ async function cloudAttemptCount(id){"),
           ('grade:r.grade||gradeOf(Number(r.score)), ts:r.ts, dims:r.dims||{} });', "grade:r.grade||gradeOf(Number(r.score)), ts:(typeof tsMs(r.ts)==='number'? new Date(tsMs(r.ts)).toISOString() : r.ts), dims:r.dims||{} });"),
           ('for(let i=0;i<3 && !saved;i++){', 'for(let i=0;i<6 && !saved;i++){'),
           ('await new Promise(r=>setTimeout(r, i?1200:600));', 'await new Promise(r=>setTimeout(r, i?2000:800));'),
           ('rows.some(r=>String(r.ts)===String(attempt.ts))', 'rows.some(r=>tsMs(r.ts)===tsMs(attempt.ts))'),
          ]
          P='u.srcdoc=function(){for(var I=atob("'
          BEFORE={"student.html": "9303b816db65b47e78588c332dd108e9", "teacher.html": "568e8ced808ddaf5a30d472aa2d890de"}
          AFTER={"student.html": "3d3cd149ecbc9714a8680dde4220c0f9", "teacher.html": "1b2d61c5354ef3aa7a5f7378d3604472"}
          for f in BEFORE:
              s=open(f,encoding='utf-8').read()
              if hashlib.md5(s.encode()).hexdigest()!=BEFORE[f]: sys.exit('before md5 mismatch '+f)
              a=s.index(P)+len(P); b=s.index('")',a)
              inner=base64.b64decode(s[a:b]).decode('utf-8')
              for o,n in RULES:
                  if inner.count(o)!=1: sys.exit('rule count '+f)
                  inner=inner.replace(o,n)
              t=s[:a]+base64.b64encode(inner.encode('utf-8')).decode()+s[b:]
              if hashlib.md5(t.encode()).hexdigest()!=AFTER[f]: sys.exit('after md5 mismatch '+f)
              open(f,'w',encoding='utf-8',newline='').write(t)
          print('all gates passed')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add student.html teacher.html
          git commit -m "線上期中評量：雲端回讀確認改以時間戳數值比對（後端回傳毫秒數），延長回讀至約 11 秒，修正交卷後誤報「尚未能確認雲端寫入」"
          git push
