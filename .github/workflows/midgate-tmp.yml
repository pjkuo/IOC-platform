name: midgate-tmp
on:
  push:
    paths: ['.github/workflows/midgate-tmp.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch midterm teacher gate (md5 gates)
        run: |
          python3 - <<'PY'
          RULES = [
          ("""<p class="muted" style="margin-top:10px;">＊預設存取碼可於原始碼頂端 <b>TEACHER_CODE</b> 修改。</p>""",
           """<p id="gateMsg" class="muted" style="margin-top:10px;color:#a03434;font-weight:700;"></p><p class="muted" style="margin-top:6px;">＊與<b>教師工作台</b>相同的教師碼（雲端後端驗證）；已在工作台或教師版登入者自動帶入。</p>"""),
          ("""const TEACHER_CODE   = "npust1728"; // ← 教師存取碼（請自行修改）""",
           """const TEACHER_CODE   = "npust1728"; let TEACHER_OK_CODE = ""; // ← 離線備援用；連線時一律以雲端後端驗證（與教師工作台同一組教師碼）"""),
          ("""body: JSON.stringify({ action:'state', open:!!open, code:TEACHER_CODE }) });""",
           """body: JSON.stringify({ action:'state', open:!!open, code:(TEACHER_OK_CODE||TEACHER_CODE) }) });"""),
          ("""$('gateBtn').addEventListener('click',()=>{
            if($('teacherCode').value===TEACHER_CODE){ $('teacherGate').classList.add('hidden'); $('teacherPanel').classList.remove('hidden'); loadReport(); renderStateBadge(); }
            else alert('存取碼錯誤');
          });""",
          """/* 教師碼與教師工作台（console.html）相同：連線時以雲端後端 action=list&kind=__auth__ 驗證，離線才比對本機 TEACHER_CODE */
          const AE_CODE_KEY='ae.cloud.teacherCode';
          function aeSavedCode(){ try{ return sessionStorage.getItem(AE_CODE_KEY)||''; }catch(e){ return ''; } }
          async function verifyTeacherCode(c){
            if(!c) return false;
            if(cloudOn()){
              try{
                const r=await fetch(GAS_ENDPOINT+'?action=list&kind=__auth__&code='+encodeURIComponent(c)+'&t='+Date.now());
                const j=await r.json();
                if(j && j.ok===true) return true;
                if(j && j.ok===false) return false;
              }catch(e){}
            }
            return c===TEACHER_CODE;
          }
          function openTeacherPanel(c){
            TEACHER_OK_CODE=c; try{ sessionStorage.setItem(AE_CODE_KEY,c); }catch(e){}
            $('gateMsg').textContent=''; $('teacherGate').classList.add('hidden'); $('teacherPanel').classList.remove('hidden'); loadReport(); renderStateBadge();
          }
          $('gateBtn').addEventListener('click',async ()=>{
            const c=$('teacherCode').value.trim(), btn=$('gateBtn');
            if(!c){ $('gateMsg').textContent='請輸入教師碼。'; return; }
            btn.disabled=true; $('gateMsg').textContent='驗證中…';
            const ok=await verifyTeacherCode(c);
            btn.disabled=false;
            if(ok) openTeacherPanel(c); else $('gateMsg').textContent='教師碼錯誤：請輸入與教師工作台相同的教師碼。';
          });
          (async function(){ const c=aeSavedCode(); if(c){ $('teacherCode').value=c; if(await verifyTeacherCode(c)) openTeacherPanel(c); } })();"""),
          ]
          import base64,hashlib,sys
          P='u.srcdoc=function(){for(var I=atob("'
          BEFORE={'student.html':'aa549455a33db0e5853eaa470ef824b3','teacher.html':'b0e0174b76956125cbef59f2e4564866'}
          AFTER={'student.html':'9303b816db65b47e78588c332dd108e9','teacher.html':'568e8ced808ddaf5a30d472aa2d890de'}
          for f in BEFORE:
              s=open(f,encoding='utf-8').read()
              if hashlib.md5(s.encode()).hexdigest()!=BEFORE[f]: sys.exit('before md5 mismatch '+f)
              a=s.index(P)+len(P); b=s.index('")',a)
              inner=base64.b64decode(s[a:b]).decode('utf-8')
              for o,n in RULES:
                  if inner.count(o)!=1: sys.exit('rule count '+f)
                  inner=inner.replace(o,n)
              t=s[:a]+base64.b64encode(inner.encode('utf-8')).decode()+s[b:]
              if hashlib.md5(t.encode()).hexdigest()!=AFTER[f]: sys.exit('after md5 mismatch '+f)
              open(f,'w',encoding='utf-8',newline='').write(t)
          print('all gates passed')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add student.html teacher.html
          git commit -m "線上期中評量教師報表：教師碼改與教師工作台相同（雲端後端驗證、離線退回本機、工作台登入自動帶入、錯誤改頁內提示）"
          git push
